[package]
name = "carnicerias-pos"
version = "0.1.0"
description = "Offline-first point of sale"
authors = ["Carnicerias"]
edition = "2021"

[lib]
name = "carnicerias_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false skips the optional `libudev` Linux backend (and
# its libudev-dev system dependency): port enumeration falls back to
# scanning /sys/class/tty, which is enough to list ttyUSB*/ttyS* and keeps
# the i686 Debian 12 build free of an extra system library. See
# docs/SCALE_INTEGRATION.md.
serialport = { version = "4", default-features = false }
tauri = { version = "2", features = [] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Impresión directa de tickets: API nativa del spooler de Windows (winspool.drv, datatype RAW).
# Sólo se compila en Windows; en Debian el backend de impresión responde PRINTER_UNSUPPORTED
# (ver apps/pos/src-tauri/src/printer/mod.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing"] }
