project_id = "carnicerias-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://localhost:1420/**", "tauri://localhost/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false


# Mercado Pago (D-054). verify_jwt = false en todas: el gateway sólo valida JWT legacy (HS256) y
# rompe con las claves de firma nuevas. La autenticación la hace cada función: mp-webhook por firma
# HMAC (x-signature); el resto reenvía el JWT del POS a las RPC, que exigen auth.uid() + dispositivo
# + operador (o permiso de admin) y validan RLS/sucursal en Postgres.
[functions.mp-create-order]
verify_jwt = false

[functions.mp-order-status]
verify_jwt = false

[functions.mp-cancel-order]
verify_jwt = false

[functions.mp-webhook]
verify_jwt = false

[functions.mp-admin-setup]
verify_jwt = false

# WhatsApp (D-059): ticket digital. verify_jwt = false por el mismo motivo que Mercado Pago (el gateway sólo
# valida JWT legacy). whatsapp-send-ticket reenvía el JWT del POS a la RPC (dispositivo + operador + venta);
# whatsapp-webhook se autentica con la firma X-Hub-Signature-256 (HMAC con el App Secret) y con el token de
# verificación en el GET de alta.
[functions.whatsapp-send-ticket]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

# Ticket iniciado por el cliente (D-060): el POS pide el QR con el JWT del dispositivo + token de operador.
[functions.whatsapp-create-claim]
verify_jwt = false
